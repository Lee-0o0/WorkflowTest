services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflowtest
      POSTGRES_USER: workflowtest
      POSTGRES_PASSWORD: workflowtest
    ports:
      - "5432:5432"
    volumes:
      - workflowtest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowtest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  workflowtest-postgres:
