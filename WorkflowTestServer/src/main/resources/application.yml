server:
  port: 8080

spring:
  application:
    name: workflow-test-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  web:
    resources:
      static-locations: classpath:/static/,file:../WorkflowTestWeb/dist/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto

workflowtest:
  data-dir: ${LOCALAPPDATA:${user.home}/.workflowtest}/WorkflowTest/data
  global:
    connectTimeout: 5000
    readTimeout: 10000

logging:
  file:
    name: ${LOCALAPPDATA:${user.home}/.workflowtest}/WorkflowTest/logs/workflow-test-server.log
  level:
    root: INFO
    com.workflowtest: INFO
