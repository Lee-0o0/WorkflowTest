server:
  port: ${WORKFLOWTEST_PORT:8080}
spring:
  application:
    name: workflow-test-server
  datasource:
    url: ${WORKFLOWTEST_DB_URL:jdbc:postgresql://localhost:5432/workflowtest}
    username: ${WORKFLOWTEST_DB_USERNAME:workflowtest}
    password: ${WORKFLOWTEST_DB_PASSWORD:workflowtest}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
  configuration:
    map-underscore-to-camel-case: true
workflowtest:
  security:
    jwt-secret: ${WORKFLOWTEST_JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    token-minutes: ${WORKFLOWTEST_TOKEN_MINUTES:480}
  bootstrap:
    admin-username: ${WORKFLOWTEST_ADMIN_USERNAME:admin}
    admin-password: ${WORKFLOWTEST_ADMIN_PASSWORD:ChangeMe123!}
    admin-display-name: ${WORKFLOWTEST_ADMIN_DISPLAY_NAME:系统管理员}
management:
  endpoints:
    web:
      exposure:
        include: health
